name: Build Release APK

on:
  workflow_dispatch:        # manual run from the Actions tab: builds the APK, no release
  push:
    tags: ['v*']            # pushing a tag like v1.0.4 builds the APK and publishes a release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write       # needed to create the release and attach the APK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing config
        run: |
          printf 'storeFile=kich-signing.p12\nstorePassword=kichlauncher\nkeyAlias=kich\nkeyPassword=kichlauncher\n' > keystore.properties
      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kich-launcher-release-apk
          path: app/build/outputs/apk/release/*.apk

      # ---- only on a tag push: name the APK after the tag and attach it to a GitHub release ----
      - name: Name the APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$apk" "dist/AKLauncher-${GITHUB_REF_NAME}.apk"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: AK Launcher ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
