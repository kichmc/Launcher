name: Build Release APK

on:
  workflow_dispatch:        # manual run from the Actions tab: builds the APK, no release
  push:
    tags: ['v*']            # pushing a tag like v1.0.4 builds the APK and publishes a release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write       # needed to create the release and attach the APK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure release signing from GitHub Secrets
        env:
          AK_SIGNING_KEYSTORE_BASE64: ${{ secrets.AK_SIGNING_KEYSTORE_BASE64 }}
          AK_SIGNING_STORE_PASSWORD: ${{ secrets.AK_SIGNING_STORE_PASSWORD }}
          AK_SIGNING_KEY_ALIAS: ${{ secrets.AK_SIGNING_KEY_ALIAS }}
          AK_SIGNING_KEY_PASSWORD: ${{ secrets.AK_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in AK_SIGNING_KEYSTORE_BASE64 AK_SIGNING_STORE_PASSWORD AK_SIGNING_KEY_ALIAS AK_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              exit 1
            fi
          done
          printf '%s' "$AK_SIGNING_KEYSTORE_BASE64" | base64 --decode > ak-signing.p12
          printf 'storeFile=ak-signing.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$AK_SIGNING_STORE_PASSWORD" "$AK_SIGNING_KEY_ALIAS" "$AK_SIGNING_KEY_PASSWORD" > keystore.properties
      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kich-launcher-release-apk
          path: app/build/outputs/apk/release/*.apk

      # ---- only on a tag push: name the APK after the tag and attach it to a GitHub release ----
      - name: Name the APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$apk" "dist/AKLauncher-${GITHUB_REF_NAME}.apk"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: AK Launcher ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
